<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinTrack Pro | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f1f5f9;
    font-family: Inter, sans-serif;
    padding: 20px;
}

.login-container {
    width: 440px;
    max-width: 100%;
    background: white;
    padding: 45px 40px;
    border-radius: 15px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    color: #1261b9;
    margin-bottom: 15px;
}

.subtitle {
    text-align: center;
    font-size: 15px;
    color: #666;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #333;
}

.form-group input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
}

.form-group input:focus {
    border-color: #1261b9;
}

.login-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 8px;
    background: rgb(8, 147, 8);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
}

.login-btn:hover {
    background: rgb(8,147,8);
}

.login-footer {
    text-align: center;
    font-size: 14px;
    margin-top: 25px;
    color: #666;
}

.login-footer a {
    color: #1261b9;
    text-decoration: none;
    font-weight: 600;
}

.login-footer a:hover {
    text-decoration: underline;
}

@media (max-width: 480px) {
    .login-container {
        padding: 30px 25px;
    }
}


    </style>
</head>
 

<body>

    <div class="login-container">

        <div class="logo">
            Create Account
        </div>

        <p class="subtitle">
          Join FinTrack Pro
        </p>


        <form id="registerForm">

            <div class="form-group">

                <label for="username">
                    Choose a Username
                </label>

                <input type="text" id="username" placeholder="Enter your username" required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password" id="password" placeholder="Enter your password" required>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Register
            </button>

        </form>


        <p class="login-footer">
            Already have an account? <a href="index.html">Login here</a>
        </p>

    </div>
    <script src="register.js"></script>
</body>
</html>
